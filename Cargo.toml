[package]
name = "euicc-crypto"
version = "0.1.0"
edition = "2021"
description = "Cryptographic primitives for GSMA SGP.22 / SGP.32 eSIM remote SIM provisioning"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlexsCodingAgent/euicc-crypto"

[dependencies]
# Every third-party dependency in the workspace lives here. The sibling crates
# `tuddenham-ipad` and `euicc-simulator` stay dependency-free so they always
# build offline; this crate is where that cost is paid, once.
#
# Versions are pinned exactly. `Cargo.lock` is committed and CI builds with
# `--locked`, so the versions tested are the versions used.

# ECC: ECDSA P-256 signing/verification and ECDH key agreement.
#
# `p256` is the RustCrypto implementation. It is preferred over the
# DER-speaking alternative specifically because SGP.22 carries signatures as a
# raw 64-byte r||s, which `p256` produces natively; the previous library
# emitted ASN.1 DER and required a hand-written conversion in both directions,
# which was the most bug-prone code in `src/ecdsa.rs`. See
# docs/dependency-review.md.
p256 = { version = "=0.13.2", features = ["ecdh"] }
rand_core = "=0.6.4"

# AES-128-GCM, for the bound profile package.
aes-gcm = "=0.10.3"

# AES-128-CBC, for BSP secure messaging (SGP.22 2.6.4.4).
#
# BSP does not use GCM: it encrypts with AES-CBC-128 and derives its ICV by
# encrypting a block counter with S-ENC, so GCM cannot stand in. `aes` and
# `cipher` are already in the tree as `aes-gcm`'s own dependencies, at exactly
# these versions; only the CBC mode wrapper is new. Verified against NIST
# SP 800-38A F.2.1 (CBC-AES128) and FIPS-197 (single-block AES-128, which the
# ICV rule needs). See docs/dependency-review.md.
cbc = "=0.1.2"
# The raw AES block cipher, used directly for the BSP ICV rule (encrypt the
# block number with S-ENC). Same version `aes-gcm` already pulls in.
aes = "=0.8.4"

# Still needed by `src/kdf.rs` tests and `src/aead.rs` until those move, and by
# `src/x509.rs` for the independent structural check on certificate DER.
ring = "=0.17.14"

# HKDF and HMAC.
#
# Adopted in place of the hand-rolled versions in `src/kdf.rs`. Key derivation
# sits on the critical path for every session key and there is no reason for
# this project to own it; `hmac` additionally provides the constant-time tag
# comparison. Both were verified to reproduce RFC 5869 test case 1 and RFC 4231
# test case 1 respectively, and to agree byte-for-byte with `ring`'s
# equivalents. See docs/dependency-review.md.
hkdf = "=0.12.4"
hmac = "=0.12.1"
sha2 = "=0.10.9"

# X.509 parsing. Used as an independent structural check on certificate DER,
# so a malformed certificate is rejected by a second implementation as well as
# by the local parser. Chain validation against a trust anchor is NOT performed
# here; see the note in `src/x509.rs`.
rustls-webpki = "=0.101.7"

[dev-dependencies]
