[package]
name = "euicc-crypto"
version = "0.1.0"
edition = "2021"
description = "Cryptographic primitives for GSMA SGP.22 / SGP.32 eSIM remote SIM provisioning"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlexsCodingAgent/euicc-crypto"

[dependencies]
# Every third-party dependency in the workspace lives here. The sibling crates
# `tuddenham-ipad` and `euicc-simulator` stay dependency-free so they always
# build offline; this crate is where that cost is paid, once.
#
# Versions are pinned exactly. `Cargo.lock` is committed and CI builds with
# `--locked`, so the versions tested are the versions used.

# ECC: ECDSA P-256 and brainpoolP256r1 signing/verification, plus ECDH key
# agreement.
#
# Both curves are RustCrypto implementations and both are now on the same
# `elliptic-curve` 0.14 / `ecdsa` 0.17 generation, so the workspace carries a
# single copy of each:
#
#   p256    0.14.0  -> elliptic-curve 0.14.1, ecdsa 0.17
#   bp256   0.14.0  -> elliptic-curve 0.14.1, ecdsa 0.17
#
# That version alignment is the reason this is a bump rather than an addition.
# `bp256` earlier releases (0.6.x) do match the old `ecdsa` 0.16 generation,
# but their curve arithmetic is gated behind a feature named
# `wip-arithmetic-do-not-use`: without it `BrainpoolP256r1` is only a curve
# *identity* (`Curve` / `PrimeCurve` / `PointCompression`) with no
# `AffinePoint`, no `ProjectivePoint` and no `Scalar`, so it cannot sign or
# verify anything. 0.14.0 graduates that to a stable `arithmetic` feature.
# Taking the 0.6.x shortcut would have meant shipping a brainpool curve that
# cannot do brainpool, behind a feature no reviewer could sign off on.
#
# `p256` is preferred over a DER-speaking library specifically because SGP.22
# carries signatures as a raw 64-byte r||s, which it produces natively; the
# previous library emitted ASN.1 DER and required a hand-written conversion in
# both directions, which was the most bug-prone code in `src/ecdsa.rs`.
# `bp256` behaves identically here. See docs/dependency-review.md.
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "ecdh", "pem", "std"] }
# brainpoolP256r1, required by the SGP.26 Variant O brainpool test PKI and by
# the SGP.33-1 "BRP" test sequences.
#
# `arithmetic` is not optional: it is what provides the point and scalar types
# ECDSA needs. `sha256` wires up `DigestAlgorithm` for the curve, which is what
# makes the generic `Signer` / `Verifier` impls apply; without it the key types
# exist but expose no signing or verification method.
bp256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "sha256", "pem", "std"] }
# Referenced directly for the curve-generic `SigningKey` / `VerifyingKey`
# types, the `Signer` / `Verifier` traits, `pkcs8`, and the SEC1 point
# encoding. Pulled in at the same version `p256` and `bp256` use, so there is
# exactly one `ecdsa` and one `elliptic-curve` in the tree.
#
# `algorithm` is what brings `SigningKey` / `VerifyingKey` into scope; without
# it `ecdsa` exposes only the `Signature` type.
ecdsa = { version = "=0.17.0", default-features = false, features = ["der", "pem", "pkcs8", "std", "algorithm", "sha2"] }
elliptic-curve = { version = "=0.14.1", default-features = false, features = ["sec1", "pkcs8", "std"] }
rand_core = { version = "=0.9.5", features = ["os_rng"] }

# AES-128-GCM, for the bound profile package.
aes-gcm = "=0.10.3"

# AES-128-CBC, for BSP secure messaging (SGP.22 2.6.4.4).
#
# BSP does not use GCM: it encrypts with AES-CBC-128 and derives its ICV by
# encrypting a block counter with S-ENC, so GCM cannot stand in. `aes` and
# `cipher` are already in the tree as `aes-gcm`'s own dependencies, at exactly
# these versions; only the CBC mode wrapper is new. Verified against NIST
# SP 800-38A F.2.1 (CBC-AES128) and FIPS-197 (single-block AES-128, which the
# ICV rule needs). See docs/dependency-review.md.
cbc = "=0.1.2"
# The raw AES block cipher, used directly for the BSP ICV rule (encrypt the
# block number with S-ENC). Same version `aes-gcm` already pulls in.
aes = "=0.8.4"
# AES-CMAC-128, the BSP C-MAC algorithm (SGP.22 Table 4c; NIST SP 800-38B).
#
# Not interchangeable with HMAC: BSP's C-MAC is a cipher-based MAC, and the
# value is the 8 most significant bytes of the CMAC output. Verified against
# NIST SP 800-38B D.1, all three AES-128 examples including the empty message.
cmac = "=0.7.2"

# Still needed by `src/kdf.rs` tests and `src/aead.rs` until those move, and by
# `src/x509.rs` for the independent structural check on certificate DER.
ring = "=0.17.14"

# HKDF and HMAC.
#
# Adopted in place of the hand-rolled versions in `src/kdf.rs`. Key derivation
# sits on the critical path for every session key and there is no reason for
# this project to own it; `hmac` additionally provides the constant-time tag
# comparison. Both were verified to reproduce RFC 5869 test case 1 and RFC 4231
# test case 1 respectively, and to agree byte-for-byte with `ring`'s
# equivalents. See docs/dependency-review.md.
hkdf = "=0.12.4"
hmac = "=0.12.1"
sha2 = "=0.10.9"

# X.509 parsing. Used as an independent structural check on certificate DER,
# so a malformed certificate is rejected by a second implementation as well as
# by the local parser. Chain validation against a trust anchor is NOT performed
# here; see the note in `src/x509.rs`.
rustls-webpki = "=0.101.7"

[dev-dependencies]
